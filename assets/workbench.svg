<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-label="Illustration: oscilloscope showing a waveform next to a dev board with an antenna">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="scopegrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2a2c3d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="359" height="399" rx="6" fill="url(#wall)" stroke="#30363d"/>

  <!-- window light -->
  <g opacity="0.5">
    <rect x="228" y="28" width="104" height="136" rx="3" fill="#161b22" stroke="#30363d"/>
    <g stroke="#30363d" stroke-width="3">
      <path d="M232 44H328M232 60H328M232 76H328M232 92H328M232 108H328M232 124H328M232 140H328M232 156H328"/>
    </g>
  </g>

  <!-- oscilloscope -->
  <g transform="translate(28 96)">
    <rect width="220" height="150" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <rect x="14" y="14" width="140" height="104" rx="3" fill="#0d1117"/>
    <rect x="14" y="14" width="140" height="104" fill="url(#scopegrid)"/>
    <path d="M14 66 C 24 30, 34 30, 44 66 S 64 102, 74 66 S 94 30, 104 66 S 124 102, 134 66 S 150 40, 154 52"
          fill="none" stroke="#bf91f3" stroke-width="2"/>
    <path d="M14 96 H40 V80 H62 V96 H84 V80 H106 V96 H128 V80 H154" fill="none" stroke="#38bdae" stroke-width="1.5"/>
    <g fill="#30363d">
      <circle cx="182" cy="34" r="10"/><circle cx="182" cy="66" r="10"/><circle cx="182" cy="98" r="10"/>
    </g>
    <g fill="#bf91f3"><circle cx="182" cy="34" r="3"/></g>
    <g fill="#38bdae"><circle cx="182" cy="66" r="3"/></g>
    <rect x="14" y="128" width="140" height="8" rx="2" fill="#1a1b27"/>
  </g>

  <!-- desk -->
  <rect x="0" y="300" width="360" height="100" fill="#161b22"/>
  <path d="M0 300H360" stroke="#30363d" stroke-width="2"/>

  <!-- dev board on desk -->
  <g transform="translate(206 262)">
    <rect x="0" y="0" width="120" height="46" rx="4" fill="#1a1b27" stroke="#bf91f3" stroke-width="1.5"/>
    <rect x="40" y="10" width="36" height="26" rx="3" fill="#161b22" stroke="#30363d"/>
    <g fill="#38bdae"><circle cx="14" cy="23" r="3"/><circle cx="104" cy="14" r="2"/><circle cx="104" cy="32" r="2"/></g>
    <path d="M100 0V-44" stroke="#e6edf3" stroke-width="2"/>
    <circle cx="100" cy="-46" r="3.5" fill="#e6edf3"/>
    <g fill="none" stroke="#bf91f3" stroke-width="2" stroke-linecap="round">
      <path d="M112 -58 A 16 16 0 0 1 112 -34" opacity="0.9"/>
      <path d="M122 -66 A 28 28 0 0 1 122 -26" opacity="0.55"/>
    </g>
  </g>

  <!-- probe cable from scope to board -->
  <path d="M190 246 C 190 280, 214 270, 222 276" fill="none" stroke="#38bdae" stroke-width="2" opacity="0.8"/>

  <!-- mug -->
  <g transform="translate(40 268)">
    <rect x="0" y="0" width="30" height="34" rx="4" fill="#21262d" stroke="#30363d"/>
    <path d="M30 8 h6 a6 6 0 0 1 0 14 h-6" fill="none" stroke="#30363d" stroke-width="2"/>
    <path d="M8 -6 q4 -6 0 -12 M18 -6 q4 -6 0 -12" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
